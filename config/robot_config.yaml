# Robot configuration
robot:
  model: wxai_v0
  end_effector: wxai_v0_leader
  ip: "192.168.2.2"
  debug: false

# Camera configuration
camera:
  device_id: 0  # preferred index; scripts auto-resolve if macOS reorders it (see check_camera.py)
  width: 1280
  height: 720
  backend: "AVFOUNDATION"  # AVFOUNDATION (macOS), DSHOW (Windows), V4L2 (Linux)

# Detection configuration
detection:
  model_path: "learning/models/marker_detection/best.pt"
  confidence_threshold: 0.25
  image_size: 640
  save_predictions: true
  prediction_interval: 10  # seconds
